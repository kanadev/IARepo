- name: Install update on Windows Server 2008 R2
  hosts: windows
  become: yes
  tasks:
    - name: Navigate to the directory where the update file is located
      shell: cd C:\path\to\update\directory
      args:
        chdir: C:\path\to\update\directory

    - name: Install the update using msiexec
      shell: msiexec /i <update_file>
      args:
        chdir: C:\path\to\update\directory

    - name: Notify completion
      debug:
        msg: "Update installed successfully on Windows Server 2008 R2."