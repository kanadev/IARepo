- name: Install update on Windows Server 2008 R2
  hosts: windows
  tasks:
    - name: Open command prompt and navigate to update directory
      shell: |
        cd C:\path\to\update\directory
      when: ansible_os_family == "Windows"

    - name: Install the update using msiexec
      shell: |
        msiexec /i <update_file>
      when: ansible_os_family == "Windows"